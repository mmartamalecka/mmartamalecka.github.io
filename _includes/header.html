{% assign nav_sections = site.sections | sort: "order" %}
<header class="site-header" data-header>
  <div class="header-inner">
    <a class="brand" href="#home" data-nav-link aria-label="Marta Małecka">Marta Małecka</a>

    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-menu-toggle>
      <span class="lang-en">Menu</span><span class="lang-pl">Menu</span>
    </button>

    <nav class="site-nav" id="site-nav" aria-label="main navigation" data-nav>
      <ul>
        {% for s in nav_sections %}
        <li>
          <a href="#{{ s.id }}" data-nav-link>
            <span class="lang-en">{{ s.nav_en }}</span><span class="lang-pl">{{ s.nav_pl }}</span>
          </a>
        </li>
        {% endfor %}
        <li>
          <button class="lang-toggle" type="button" data-lang-toggle aria-label="Switch language / Zmień język">
            <span class="lang-en">PL</span><span class="lang-pl">EN</span>
          </button>
        </li>
      </ul>
    </nav>
  </div>
</header>
